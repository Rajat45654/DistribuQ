services:
  postgres:
    image: postgres:16-alpine
    container_name: distribuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distribuq
      POSTGRES_USER: distribuq
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distribuq -d distribuq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: distribuq-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: python -m api.run
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://distribuq:password@postgres:5432/distribuq
      - REDIS_URL=redis://redis:6379/0
      - API_PORT=8080
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m worker.worker
    environment:
      - DATABASE_URL=postgresql://distribuq:password@postgres:5432/distribuq
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
